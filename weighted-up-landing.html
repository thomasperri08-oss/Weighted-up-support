<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weighted Up — Ta progression, séance après séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e12;
    --bg-panel:#12181f;
    --amber:#0a84ff;
    --amber-soft:#5eb0ff;
    --text-primary:#f4f6f8;
    --text-muted:#8a94a3;
    --line:#1e2731;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
  }

  /* ambient glow */
  .glow{
    position:absolute;
    top:-10%;
    left:50%;
    transform:translateX(-50%);
    width:140%;
    height:60%;
    background:radial-gradient(ellipse at center, rgba(10,132,255,0.14) 0%, rgba(10,132,255,0.05) 40%, rgba(10,14,18,0) 70%);
    pointer-events:none;
    z-index:0;
  }

  .browser-chrome{
    width:100%;
    padding:14px 0 12px;
    text-align:center;
    font-size:13px;
    color:var(--text-muted);
    background:rgba(255,255,255,0.02);
    border-bottom:1px solid var(--line);
    z-index:1;
    letter-spacing:0.2px;
  }
  .browser-chrome svg{vertical-align:-2px;margin-right:5px;}

  main{
    flex:1;
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 28px 20px;
    z-index:1;
    text-align:center;
  }

  /* --- Signature element: progression line --- */
  .progress-mark{
    width:180px;
    height:110px;
    margin-bottom:6px;
  }
  .progress-mark path.track{
    fill:none;
    stroke:var(--line);
    stroke-width:2;
  }
  .progress-mark path.line{
    fill:none;
    stroke:var(--amber);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:220;
    stroke-dashoffset:220;
    animation:draw 1.6s cubic-bezier(.4,0,.2,1) 0.2s forwards;
  }
  .progress-mark circle.pr-dot{
    fill:var(--amber);
    opacity:0;
    animation:appear 0.4s ease 1.7s forwards, pulse 2s ease-in-out 2.1s infinite;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes appear{ to{ opacity:1; } }
  @keyframes pulse{
    0%,100%{ filter:drop-shadow(0 0 0px rgba(10,132,255,0.8)); }
    50%{ filter:drop-shadow(0 0 8px rgba(10,132,255,0.9)); }
  }

  .wordmark{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:44px;
    letter-spacing:-0.5px;
    line-height:1;
    margin-top:8px;
  }
  .wordmark span{ color:var(--amber); }

  .tagline{
    font-size:16px;
    color:var(--text-muted);
    margin-top:14px;
    font-weight:500;
    max-width:280px;
    line-height:1.4;
  }

  .cta{
    margin-top:44px;
    width:100%;
    max-width:340px;
  }

  .store-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    width:100%;
    background:linear-gradient(135deg,var(--amber),#4aa3ff);
    color:#001b3d;
    text-decoration:none;
    border-radius:16px;
    padding:14px 20px;
    box-shadow:0 8px 24px rgba(10,132,255,0.28);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .store-btn:active{
    transform:scale(0.97);
    box-shadow:0 4px 14px rgba(10,132,255,0.24);
  }
  .store-btn .apple-icon{ flex-shrink:0; }
  .store-btn .store-text{ text-align:left; line-height:1.15; }
  .store-btn .store-text small{
    display:block;
    font-size:11px;
    font-weight:500;
    opacity:0.75;
  }
  .store-btn .store-text strong{
    display:block;
    font-size:19px;
    font-weight:800;
    font-family:'Sora',sans-serif;
  }

  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    padding:24px 0 34px;
    z-index:1;
  }

  .ig-link{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--bg-panel);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .ig-link:active{ transform:scale(0.94); }
  .ig-link svg{ width:24px; height:24px; }

  .footer-note{
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.3px;
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="browser-chrome">
    <svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M3 6V4a3 3 0 116 0v2" stroke="#8a94a3" stroke-width="1.3"/><rect x="1.5" y="6" width="9" height="6.5" rx="1.3" stroke="#8a94a3" stroke-width="1.3"/></svg>
    weightedup.app
  </div>

  <main>
    <svg class="progress-mark" viewBox="0 0 180 110" aria-hidden="true">
      <path class="track" d="M6 88 C 40 88, 55 92, 80 70 S 130 40, 174 14"/>
      <path class="line" d="M6 88 C 40 88, 55 92, 80 70 S 130 40, 174 14"/>
      <circle class="pr-dot" cx="174" cy="14" r="5.5"/>
    </svg>

    <div class="wordmark">WEIGHTED<span>·</span>UP</div>
    <p class="tagline">Planifie. Entraîne-toi. Évolue.</p>

    <div class="cta">
      <a class="store-btn" href="itms-apps://apps.apple.com/fr/app/weighted-up/id6787407795">
        <svg class="apple-icon" width="24" height="30" viewBox="0 0 384 512" fill="#001b3d">
          <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
        </svg>
        <span class="store-text">
          <small>Télécharger sur</small>
          <strong>App Store</strong>
        </span>
      </a>
    </div>
  </main>

  <footer>
    <a class="ig-link" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="#f4f6f8" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="4.3" stroke="#f4f6f8" stroke-width="1.6"/>
        <circle cx="17.4" cy="6.6" r="1.15" fill="#f4f6f8"/>
      </svg>
    </a>
    <div class="footer-note">© 2026 Weighted Up</div>
  </footer>

</body>
</html>
